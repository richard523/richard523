<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eaeaea;
    }
    h1 {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #e94560, #ff9a5a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { margin-top: 1rem; font-size: 1.25rem; color: #a0a0c0; }
    button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #e94560;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:hover { background: #ff5c78; transform: translateY(-2px); }
    #counter { margin-top: 1rem; font-size: 0.95rem; color: #6a6a8a; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>Your first app is up and running.</p>
  <button id="greetBtn">Click me</button>
  <span id="counter">Clicked 0 times</span>

  <script>
    let count = 0;
    const btn = document.getElementById('greetBtn');
    const counter = document.getElementById('counter');
    btn.addEventListener('click', () => {
      count++;
      counter.textContent = 'Clicked ' + count + (count === 1 ? ' time' : ' times');
    });
  </script>
</body>
</html>
